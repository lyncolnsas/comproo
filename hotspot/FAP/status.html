<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Status da Conexão | Faculdade Adventista do Paraná</title>
  <meta http-equiv="refresh" content="15">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <style>
    :root{
      --fap-blue: #002B49;
      --fap-blue-dark: #001726;
      --fap-gold: #F39200;
      --fap-gold-hover: #d98000;
      --card-bg: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --danger: #ef4444;
      --success: #10b981;
    }
    *{box-sizing:border-box}
    body{
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, var(--fap-blue) 0%, var(--fap-blue-dark) 100%);
      color: var(--text);
      margin: 0; padding: 15px;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .wrap{width: 100%; max-width: 480px;}
    .card{
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border-top: 5px solid var(--fap-gold);
    }
    .header{text-align: center; margin-bottom: 20px;}
    .header h1{margin: 0 0 6px; font-size: 22px; color: var(--fap-blue); font-weight: 800;}
    .header p{margin: 0; font-size: 13px; color: var(--muted);}
    .grid{display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 16px;}
    .k{
      padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: #f9fafb; font-size: 13px;
    }
    .k b{color: var(--fap-blue); display: block; font-size: 11px; text-transform: uppercase; margin-bottom: 3px;}
    .row{display: flex; gap: 10px; margin-top: 20px;}
    a.btn, button.btn{
      flex: 1; display: flex; align-items: center; justify-content: center;
      appearance: none; border: none; cursor: pointer;
      padding: 12px 16px; border-radius: 8px; font-weight: 700; font-size: 14px;
      text-decoration: none; text-align: center; transition: all 0.2s ease;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .btn.danger{ background: var(--danger); color: #fff; }
    .btn.danger:hover{ background: #dc2626; transform: translateY(-1px); }
    .btn.secondary{ background: var(--fap-gold); color: var(--fap-blue-dark); }
    .btn.secondary:hover{ background: var(--fap-gold-hover); transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header">
        <h1>Conexão Ativa</h1>
        <p>Faculdade Adventista do Paraná • Wi-Fi</p>
      </div>

      <div class="grid">
        <div class="k"><b>Usuário</b>$(username)</div>
        <div class="k"><b>Endereço IP</b>$(ip)</div>
        <div class="k"><b>Endereço MAC</b>$(mac)</div>
        <div class="k"><b>Tempo Conectado</b>$(uptime)</div>
        <div class="k"><b>Tempo Restante</b>$(session-time-left)</div>
        <div class="k"><b>Download</b>$(bytes-out-nice)</div>
        <div class="k"><b>Upload</b>$(bytes-in-nice)</div>
        <div class="k"><b>Status</b><span style="color: var(--success); font-weight: bold;">Autenticado</span></div>
      </div>

      <form action="$(link-logout)" method="post" class="row">
        <input type="hidden" name="erase-cookie" value="on" />
        <button class="btn danger" type="submit">Desconectar</button>
        <a class="btn secondary" href="https://faculdadeadventista.edu.br/" target="_blank">Acessar Portal</a>
      </form>
    </div>
  </div>
</body>
</html>
