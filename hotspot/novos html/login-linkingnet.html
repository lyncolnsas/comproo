<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>LINKING NET - Hotspot Wi-Fi</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #001f3f 0%, #000a14 100%);
      color: #ffffff;
      padding: 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Card Principal com Animação de Entrada */
    .portal-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 410px;
      background: rgba(14, 18, 26, 0.85);
      border: 1px solid rgba(0, 212, 255, 0.3);
      border-radius: 24px;
      padding: 36px 26px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7), 0 0 25px rgba(0, 212, 255, 0.4);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      animation: entranceCard 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: all 0.5s ease;
    }

    .portal-card.submitting {
      animation: exitCard 0.65s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }

    @keyframes entranceCard {
      0% { opacity: 0; transform: translateY(30px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes exitCard {
      0% { opacity: 1; transform: scale(1); }
      30% { transform: scale(1.04); box-shadow: 0 0 35px rgba(0, 212, 255, 0.4); }
      100% { opacity: 0; transform: scale(0.85) translateY(-25px); filter: blur(8px); }
    }

    /* Header */
    .header-box {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 14px auto;
      background: linear-gradient(135deg, #00d4ff 0%, #0077b6 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 22px rgba(0, 212, 255, 0.4);
      animation: iconFloat 3.5s infinite alternate ease-in-out;
    }

    .badge-icon svg {
      width: 38px;
      height: 38px;
      fill: #ffffff;
    }

    @keyframes iconFloat {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-6px) scale(1.05); }
    }

    h1.theme-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: #ffffff;
      text-transform: uppercase;
    }

    p.theme-sub {
      font-size: 13px;
      color: #9eb1c7;
      margin-top: 5px;
    }

    /* Inputs */
    .field-group {
      margin-bottom: 18px;
      position: relative;
    }

    .field-group label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #00d4ff;
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      fill: #617387;
      transition: fill 0.3s ease;
    }

    .field-group input {
      width: 100%;
      background: #0b1017;
      border: 1.5px solid #1f2b3a;
      border-radius: 12px;
      padding: 13px 14px 13px 44px;
      font-size: 14px;
      color: #ffffff;
      outline: none;
      transition: all 0.3s ease;
    }

    .field-group input:focus {
      border-color: #00d4ff;
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.4);
      background: #111822;
    }

    .field-group input:focus + svg {
      fill: #00d4ff;
    }

    /* Botão Principal */
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #00d4ff 0%, #0077b6 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0, 212, 255, 0.4);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 212, 255, 0.4);
      filter: brightness(1.15);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    /* Visitante / Trial */
    .guest-box {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
    }

    .btn-guest {
      display: inline-block;
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 212, 255, 0.3);
      border-radius: 10px;
      color: #00d4ff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-guest:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }

    .footer-note {
      display: block;
      margin-top: 12px;
      font-size: 11px;
      color: #607285;
    }

    /* Erro MikroTik */
    .error-card {
      background: rgba(220, 53, 69, 0.18);
      border: 1px solid #dc3545;
      color: #ff8591;
      padding: 10px;
      border-radius: 10px;
      font-size: 12.5px;
      text-align: center;
      margin-bottom: 16px;
    }

    /* Overlay pós-login */
    #loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8, 11, 16, 0.95);
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .ring-spinner {
      width: 50px;
      height: 50px;
      border: 3.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: #00d4ff;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loader-text {
      margin-top: 18px;
      color: #00d4ff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-align: center;
      padding: 0 15px;
    }
  </style>
</head>

<body>
  
          <div class="fiber-grid"></div>
          <style>
            .fiber-grid {
              position: absolute; inset: 0;
              background-image: linear-gradient(rgba(0,212,255,0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(0,212,255,0.07) 1px, transparent 1px);
              background-size: 35px 35px;
            }
          </style>
        

  <!-- Overlay pós-login -->
  <div id="loading-overlay">
    <div class="ring-spinner"></div>
    <div class="loader-text">Estabelecendo Link Óptico 10Gbps...</div>
  </div>

  <!-- Form Oculto MikroTik CHAP/MD5 -->
  $(if chap-id)
  <form name="sendin" action="$(link-login-only)" method="post" style="display:none;">
    <input type="hidden" name="username" />
    <input type="hidden" name="password" />
    <input type="hidden" name="dst" value="$(link-orig)" />
    <input type="hidden" name="popup" value="true" />
  </form>
  <script type="text/javascript" src="/md5.js"></script>
  $(endif)

  <!-- Card Principal -->
  <div class="portal-card" id="mainCard">
    <div class="header-box">
      <div class="badge-icon">
        <svg viewBox="0 0 24 24">
          <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/>
        </svg>
      </div>
      <h1 class="theme-title">LINKING NET</h1>
      <p class="theme-sub">Conexão de Ultra Fibra Óptica</p>
    </div>

    $(if error)
    <div class="error-card">
      $(error)
    </div>
    $(endif)

    <form name="login" action="$(link-login-only)" method="post" onsubmit="return handleAuthLogin(event)">
      <input type="hidden" name="dst" value="$(link-orig)" />
      <input type="hidden" name="popup" value="true" />

      <div class="field-group">
        <label for="usernameField">Identificação / Usuário</label>
        <div class="input-wrap">
          <input id="usernameField" type="text" name="username" value="$(username)" placeholder="Digite seu usuário ou voucher" required autofocus autocomplete="username">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
      </div>

      <div class="field-group">
        <label for="passwordField">Senha de Acesso</label>
        <div class="input-wrap">
          <input id="passwordField" type="password" name="password" placeholder="Digite sua senha" required autocomplete="current-password">
          <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <span>SINCRONIZAR LINK</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.14 12l-8.29-8.29-1.42 1.42L16.86 11H5v2z"/>
        </svg>
      </button>

      <div class="guest-box">
        $(if trial == 'yes')
        <a href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)" class="btn-guest">
          ⚡ Acesso Teste / Visitante Grátis
        </a>
        $(endif)
        <span class="footer-note">HotSpot LinkingNet - Autenticação Segura</span>
      </div>
    </form>
  </div>

  <script type="text/javascript">
    function handleAuthLogin(e) {
      var card = document.getElementById('mainCard');
      var overlay = document.getElementById('loading-overlay');
      
      card.classList.add('submitting');
      
      setTimeout(function() {
        overlay.style.display = 'flex';
      }, 350);

      $(if chap-id)
      e.preventDefault();
      setTimeout(function() {
        document.sendin.username.value = document.login.username.value;
        document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
        document.sendin.submit();
      }, 550);
      return false;
      $(endif)

      return true;
    }
  </script>
</body>
</html>
