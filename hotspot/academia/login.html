<!DOCTYPE html><html lang="pt-br"><head>
  <meta charset="utf-8">
  <title>Hotspot - Wi-Fi Academia Pro</title>
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <script src="md5.js"></script>

  <!-- CSS que dita o formato, local e cores vem INTEIRAMENTE do MikroGestor -->
  <!-- MIKROGESTOR_THEME_LINK -->
  <style id="mg-theme-css-inline">

/* ==============================================
   MIKROGESTOR PORTAL CSS — GERADO DINAMICAMENTE
   ============================================== */
@import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Inter:wght@400;600;700&family=Montserrat:wght@400;600;700&family=Outfit:wght@400;600;700&family=Poppins:wght@400;600;700&family=Roboto+Mono:wght@400;600;700&display=swap');

:root {
  --brand: #10b981;
  --brand-dark: #059669;
  --bg: #09090b;
  --ink: #f0fdf4;
  --muted: #86efac;
  --blue: #10b981;
  --green: #f97316;
  --font-family: 'Cabinet Grotesk', 'Outfit', 'Segoe UI', Roboto, Arial, sans-serif;
  --glass-opacity: 1.00;
  --glass-blur: 24px;
  --border-radius: 10px;
  --card-bg-rgb: 12, 20, 16;
  --glow-color: transparent;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0;
  min-width: 300px;
  font-family: var(--font-family);
  background: transparent !important;
  min-height: 100vh;
  color: var(--ink);
}

  /* Background Video */
  #mg-bg-video {
    position: fixed;
    right: 0;
    bottom: 0;
    min-width: 100%;
    min-height: 100%;
    z-index: -100;
    object-fit: cover;
    background-color: #000;
    pointer-events: none;
  }

#heading {
  display: flex; align-items: center; justify-content: center;
  background: var(--brand); color: #fff; width: 100%; height: 112px; position: relative; padding: 16px;
}
#business-name {
  font-size: 1.25rem; font-weight: 700; letter-spacing: -0.025em; text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; padding-top: 16px; margin: 0; color: #fff;
}
#iden {
  width: 64px; height: 64px; background-color: #fff; border-radius: 9999px; overflow: hidden;
  border: 1px solid #e2e8f0; box-shadow: 0 1px 2px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center; margin: -32px auto 0; position: relative; z-index: 10;
}
#iden img { max-width: 100%; max-height: 100%; object-fit: contain; }
#box {
  position: relative; background: rgba(var(--card-bg-rgb), var(--glass-opacity)) !important;
  backdrop-filter: blur(var(--glass-blur)) !important; -webkit-backdrop-filter: blur(var(--glass-blur)) !important;
  border-radius: var(--border-radius) !important; border: 1px solid rgba(255,255,255,0.25) !important;
  box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06) !important;
  padding: 20px; margin: 24px auto 0; max-width: 420px; width: calc(100% - 32px); padding-bottom: 24px;
}
.mg-message { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 16px; }
#user, #pass {
  border: 1px solid #e2e8f0; color: #111827; background: rgba(248,250,252,0.9); height: 40px; font-size: 14px;
  font-family: var(--font-family); display: block; width: 100%; border-radius: 8px; padding: 0 12px; margin: 12px 0;
  -webkit-appearance: none; appearance: none; outline: none; transition: border-color 0.2s;
}
#user:focus, #pass:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
#user::placeholder, #pass::placeholder { color: var(--muted); }
.actions { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 12px !important; margin-top: 16px !important; }
.btn {
  -webkit-appearance: none; appearance: none; border: 0; height: 40px; border-radius: 8px; cursor: pointer; font-weight: 700;
  font-size: 13px; font-family: var(--font-family); width: 100%; display: flex !important; align-items: center; justify-content: center;
  box-shadow: 0 1px 2px rgba(0,0,0,0.08); transition: filter 0.2s ease, transform 0.1s; touch-action: manipulation; text-decoration: none; opacity: 0.95;
}
.btn:active { transform: translateY(1px); }
.btn-login { background: var(--blue) !important; color: #fff !important; }
.btn-login:hover { filter: brightness(0.92); }
.btn-cad { background: var(--green) !important; color: #fff !important; }
.btn-cad:hover { filter: brightness(0.92); }
.footer { text-align: center; margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.07); font-size: 9px; color: var(--muted); }
.footer a { text-decoration: none; color: var(--blue); }
.err {
  background: #1f2937; border: 1px solid #7f1d1d; color: #fecaca; padding: 8px 12px; border-radius: 10px; margin: 16px auto 0;
  max-width: 420px; width: calc(100% - 32px); text-align: center; font-size: 13px;
}
@media (max-width: 480px) {
  #box { padding: 16px; }
  .actions { grid-template-columns: 1fr !important; gap: 8px !important; }
}

  </style>
  <!-- END_MIKROGESTOR_THEME_LINK -->

  <style>
    /* Apenas CSS base para nao ficar invisivel se falhar o carregamento antes do script */
    body { background-color: #0c0c18; color: #fff; display: block; }
    /* AdCarouselStyles */

/* EndAdCarouselStyles */
  </style>
</head>

<body>
  <!-- Script que injeta o Video/Imagem de Fundo vindo do MikroGestor -->
  <!-- MIKROGESTOR_BG_SCRIPT -->
<!-- END_MIKROGESTOR_BG_SCRIPT -->

  <!-- AdCarouselBlock -->

<!-- EndAdCarouselBlock -->

  $(if chap-id)
  <form name="sendin" action="$(link-login-only)" method="post" style="display:none">
    <input type="hidden" name="username">
    <input type="hidden" name="password">
    <input type="hidden" name="dst" value="$(link-orig)">
    <input type="hidden" name="popup" value="true">
  </form>
  <script>
    function doLogin() {
      document.sendin.username.value = document.login.username.value;
      document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
      document.sendin.submit();
      return false;
    }
  </script>
  $(endif)

  <!-- TODO O DESIGN (CAIXA, ALINHAMENTO) É APLICADO PELO CSS EXTERNO -->
  <div id="mg-app-root">
    
    $(if error)<div class="err">$(error)</div>$(endif)
    
    <div id="heading">
      <h2 id="business-name">Wi-Fi Academia Pro</h2>
    </div>

    <div id="iden"><img src="logo.png" onerror="this.src='human.png';this.onerror=null;" alt="Logo" style="" /></div>

    <form name="login" action="$(link-login-only)" method="post" $(if chap-id) onSubmit="return doLogin()" $(endif)>
      <input type="hidden" name="dst" value="$(link-orig)">
      <input type="hidden" name="popup" value="true">

      <div id="box">
        <div class="mg-message">Foco, força e conexão! Insira seu voucher ou cadastre-se para liberar a internet do seu treino.</div>
        <!-- Campos Base do MikroTik -->
        <input id="user" name="username" type="text" value="$(username)" placeholder="Usuário" autocomplete="username" autocapitalize="none" autofocus="">
        <input id="pass" name="password" type="password" placeholder="Senha" autocomplete="current-password">

        <div class="actions">
          <button id="btnLogin" class="btn btn-login" type="submit">Entrar</button>
          
          <!-- Botao de Cadastro Controlado pelo MikroGestor -->
          <!-- MIKROGESTOR_REGISTER_BTN -->
<a id="btnSignup" class="btn btn-cad" href="http://portal.wifi.local/portal/register?link-login-only=$(link-login-only-esc)&link-orig=$(link-orig-esc)" style="display: flex;">Cadastre-se aqui</a>
<!-- END_MIKROGESTOR_REGISTER_BTN -->
        </div>

        <!-- Botao de Trial Controlado pelo MikroGestor -->
        <!-- MIKROGESTOR_TRIAL_BLOCK -->
<div id="trial-container" style="display: block; text-align: center; font-size: 11px; margin-top: 12px; color: var(--muted);">
  $(if trial == 'yes')
  Acesso de teste disponível, <a href="javascript:void(0)" onclick="if(confirm('Confirmar acesso de teste?')) confirmTrialLogin()" style="color: var(--blue); text-decoration: underline; font-weight: 600;">clique aqui</a>.
  $(endif)
</div>
<!-- END_MIKROGESTOR_TRIAL_BLOCK -->

        <div class="footer">
          <span>IP: $(ip) • MAC: $(mac)</span>
        </div>
      </div>
    </form>
  </div>

  <script>
    /* AdCarouselScript */

/* EndAdCarouselScript */

    function confirmTrialLogin() {
      window.location.href = '$(link-login-only-esc)?dst=$(link-orig-esc)&username=T-$(mac-esc)';
    }

    // Auto-login se parametros passados
    window.addEventListener('DOMContentLoaded', function() {
      var params = new URLSearchParams(window.location.search);
      var u = params.get('autouser') || params.get('username');
      var p = params.get('autopass') || params.get('password');
      var dst = params.get('dst');
      if (dst) {
        if (document.sendin && document.sendin.dst) document.sendin.dst.value = dst;
        if (document.login && document.login.dst) document.login.dst.value = dst;
      }
      if (u && p) {
        var uf = document.getElementById('user');
        var pf = document.getElementById('pass');
        var btn = document.getElementById('btnLogin');
        if (uf && pf) {
          uf.value = u;
          pf.value = p;
          if (btn) btn.innerHTML = 'Autenticando...';
          if (typeof doLogin === 'function' && document.sendin) {
            doLogin();
          } else {
            document.login.submit();
          }
        }
      }
    });
  </script>

</body></html>
