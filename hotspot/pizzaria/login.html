/* ==============================================
   MIKROGESTOR PORTAL CSS — GERADO DINAMICAMENTE
   ============================================== */
@import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Inter:wght@400;600;700&family=Montserrat:wght@400;600;700&family=Outfit:wght@400;600;700&family=Poppins:wght@400;600;700&family=Roboto+Mono:wght@400;600;700&display=swap');

:root {
  --brand: #d97706;
  --brand-dark: #b45309;
  --bg: #0a0a0a;
  --ink: #fef3c7;
  --muted: #fde68a;
  --blue: #d97706;
  --green: #eab308;
  --font-family: 'Inter', 'Outfit', 'Segoe UI', Roboto, Arial, sans-serif;
  --glass-opacity: 0.92;
  --glass-blur: 15px;
  --border-radius: 20px;
  --card-bg-rgb: 20, 20, 20;
  --glow-color: transparent;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0;
  min-width: 300px;
  font-family: var(--font-family);
  background: var(--bg);
  min-height: 100vh;
  color: var(--ink);
}

  /* Background Video & Image full cover responsive without borders */

    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100vw;
    height: 100vh;
    min-width: 100%;
    min-height: 100%;
    z-index: -2;
    object-fit: cover !important;
    object-position: center center !important;
    background-color: #000;
    pointer-events: none;
  }

  #mg-bg-image {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100vw;
    height: 100vh;
    min-width: 100%;
    min-height: 100%;
    z-index: -2;
    background-size: cover !important;
    background-position: center center !important;
    background-repeat: no-repeat !important;
    pointer-events: none;
  }

#mg-app-root, form, .container, main, .main, .content {
  position: relative !important;
  z-index: 1 !important;
}

#box {
  position: relative;
  z-index: 10 !important;
  background: rgba(var(--card-bg-rgb), var(--glass-opacity)) !important;
  backdrop-filter: blur(var(--glass-blur)) !important; -webkit-backdrop-filter: blur(var(--glass-blur)) !important;
  border-radius: var(--border-radius) !important; border: 1px solid rgba(255,255,255,0.25) !important;
  box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06) !important;
  padding: 20px; margin: 40px auto 24px; max-width: 420px; width: calc(100% - 32px); padding-bottom: 24px;
}
.mg-message { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 16px; }
#user, #pass {
  border: 1px solid #e2e8f0; color: #111827; background: rgba(248,250,252,0.9); height: 40px; font-size: 14px;
  font-family: var(--font-family); display: block; width: 100%; border-radius: 8px; padding: 0 12px; margin: 12px 0;
  -webkit-appearance: none; appearance: none; outline: none; transition: border-color 0.2s;
}
#user:focus, #pass:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
#user::placeholder, #pass::placeholder { color: var(--muted); }
.actions { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 12px !important; margin-top: 16px !important; }
.btn {
  -webkit-appearance: none; appearance: none; border: 0; height: 40px; border-radius: 8px; cursor: pointer; font-weight: 700;
  font-size: 13px; font-family: var(--font-family); width: 100%; display: flex !important; align-items: center; justify-content: center;
  box-shadow: 0 1px 2px rgba(0,0,0,0.08); transition: filter 0.2s ease, transform 0.1s; touch-action: manipulation; text-decoration: none; opacity: 0.95;
}
.btn:active { transform: translateY(1px); }
.btn-login { background: var(--blue) !important; color: #fff !important; }
.btn-login:hover { filter: brightness(0.92); }
.btn-cad { background: var(--green) !important; color: #fff !important; }
.btn-cad:hover { filter: brightness(0.92); }
.footer { text-align: center; margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.07); font-size: 9px; color: var(--muted); }
.footer a { text-decoration: none; color: var(--blue); }
.err {
  background: #1f2937; border: 1px solid #7f1d1d; color: #fecaca; padding: 8px 12px; border-radius: 10px; margin: 16px auto 0;
  max-width: 420px; width: calc(100% - 32px); text-align: center; font-size: 13px;
}
@media (max-width: 480px) {
  #box { padding: 16px; }
  .actions { grid-template-columns: 1fr !important; gap: 8px !important; }
}

<link href="fonts/fonts.css" rel="stylesheet">
<canvas id="mg-fx-niche" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events:none; background:#020508;"></canvas>

<style>
body { background: transparent !important; }
html body, html body[class], body.theme-default, body[class*="theme-"], html, body, .theme-layout, #wrapper, .bg-overlay, .background-overlay { background: transparent !important; background-color: transparent !important; background-image: none !important; }
#mg-app-root, form, .container, main, .main, .content { position: relative !important; z-index: 1 !important; }

#mg-fx-niche, #mg-fx-canvas-particles, #mg-fx-canvas-matrix, #mg-fx-canvas-warp, #mg-fx-canvas-waves, #mg-fx-cybergrid, #mg-fx-orbs, #mg-fx-fireflies, #mg-fx-aurora { background: transparent !important; background-color: transparent !important; }
#box, .login-card, .card { border-radius: 20px !important; clip-path: none !important; }

#box, .login-card, .card {
  position: relative !important;
  box-shadow: 0 0 25px #d9770640, inset 0 0 15px #d9770620 !important;
}
#box::before, .login-card::before, .card::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: inherit;
  padding: 2px;
  background: linear-gradient(90deg, #d97706, #eab308, #d97706, #d97706);
  background-size: 300% 300%;
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  animation: mgBorderBeam 4s linear infinite;
  pointer-events: none;
}
@keyframes mgBorderBeam {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.btn-login, #btnSignup, button[type="submit"], input[type="submit"] {
  position: relative !important;
  overflow: hidden !important;
}
.btn-login::after, #btnSignup::after, button[type="submit"]::after {
  content: '' !important;
  position: absolute !important;
  top: -50% !important;
  left: -60% !important;
  width: 40% !important;
  height: 200% !important;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent) !important;
  transform: rotate(30deg) !important;
  animation: mgShimmerSweep 3.5s infinite !important;
  pointer-events: none !important;
}
@keyframes mgShimmerSweep {
  0% { left: -60%; }
  30% { left: 140%; }
  100% { left: 140%; }
}

#box h1, .card h1, .title {
  background: linear-gradient(135deg, #d97706, #eab308, #d97706, #d97706) !important;
  background-size: 300% 300% !important;
  -webkit-background-clip: text !important;
  -webkit-text-fill-color: transparent !important;
  animation: mgTitleGradient 6s ease infinite alternate !important;
}
@keyframes mgTitleGradient {
  0% { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}

</style>
<script>
(function() {
  var c = document.getElementById('mg-fx-niche'); if (!c) return;
  var ctx = c.getContext('2d');
  function resize() { c.width = window.innerWidth || document.documentElement.clientWidth || 360; c.height = window.innerHeight || document.documentElement.clientHeight || 640; }
  window.addEventListener('resize', resize); window.addEventListener('load', resize); resize();
  var angle = 0;
  function draw() {
    ctx.fillStyle = 'rgba(2, 5, 8, 0.08)'; ctx.fillRect(0, 0, c.width, c.height);
    var cx = c.width / 2; var cy = c.height / 2;
    angle += 0.025;
    ctx.strokeStyle = 'rgba(234, 88, 12, 0.15)'; ctx.lineWidth = 1;
    for (var r = 60; r <= 300; r += 60) { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(angle) * 320, cy + Math.sin(angle) * 320);
    ctx.strokeStyle = '#d97706'; ctx.lineWidth = 2; ctx.shadowBlur = 10; ctx.shadowColor = '#d97706'; ctx.stroke(); ctx.shadowBlur = 0;
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

    function confirmTrialLogin() {
      window.location.href = '$(link-login-only-esc)?dst=$(link-orig-esc)&username=T-$(mac-esc)';
    }

    // Auto-login se parametros passados
    window.addEventListener('DOMContentLoaded', function() {
      var params = new URLSearchParams(window.location.search);
      var u = params.get('autouser') || params.get('username');
      var p = params.get('autopass') || params.get('password');
      var dst = params.get('dst');
      if (dst) {
        if (document.sendin && document.sendin.dst) document.sendin.dst.value = dst;
        if (document.login && document.login.dst) document.login.dst.value = dst;
      }
      if (u && p) {
        var uf = document.getElementById('user');
        var pf = document.getElementById('pass');
        var btn = document.getElementById('btnLogin');
        if (uf && pf) {
          uf.value = u;
          pf.value = p;
          if (btn) btn.innerHTML = 'Autenticando...';
          if (typeof doLogin === 'function' && document.sendin) {
            doLogin();
          } else {
            document.login.submit();
          }
        }
      }
    });
