/* ==============================================
   MIKROGESTOR PORTAL CSS — GERADO DINAMICAMENTE

@import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Inter:wght@400;600;700&family=Montserrat:wght@400;600;700&family=Outfit:wght@400;600;700&family=Poppins:wght@400;600;700&family=Roboto+Mono:wght@400;600;700&display=swap');

:root {
  --brand: #3b82f6;
  --brand-dark: #2563eb;
  --bg: #090d16;
  --ink: #f8fafc;
  --muted: #94a3b8;

  --font-family: 'Inter', 'Outfit', 'Segoe UI', Roboto, Arial, sans-serif;
  --glass-opacity: 0.90;
  --glass-blur: 14px;

  --card-bg-rgb: 15, 23, 42;

}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;

  min-width: 300px;
  font-family: var(--font-family);
  background: var(--bg);

}

    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100vw;
    height: 100vh;
    min-width: 100%;
    min-height: 100%;
    z-index: -2;

  }

  #mg-bg-image {
    position: fixed;
    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;
    min-width: 100%;
    min-height: 100%;
    z-index: -2;

    background-repeat: no-repeat !important;

#mg-app-root, form, .container, main, .main, .content {

}

    body { background-color: #0c0c18; color: #fff; display: block; }
    /* AdCarouselStyles */

    .ad-modal-overlay {

    .ad-modal-content-wrapper {

      height: 100%;

      display: flex;
      justify-content: center;

    .ad-carousel-container {
      width: 100%;
      height: 100%;

      -webkit-overflow-scrolling: touch;

    .ad-carousel-slide {

      align-items: center;

    .ad-patrocinado {

      background: #eb24a2;
      color: #fff;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;

      cursor: pointer;
      z-index: 99999 !important;

      align-items: center;

      filter: brightness(0.9);
    }
    .ad-modal-close:active {
      transform: scale(0.95);
    }

    .ad-modal-timer {
      position: absolute;
      bottom: max(30px, env(safe-area-inset-bottom));
      right: 20px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 8px 18px;
      font-size: 14px;
      border-radius: 30px;
      z-index: 99999 !important;
      font-weight: bold;
      border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(5px);
    }

    /* Instagram Stories Style Top Progress Bar */
    .ad-stories-progress-container {
      position: absolute;
      top: max(20px, env(safe-area-inset-top));
      left: 20px;
      right: 20px;
      display: flex;
      gap: 6px;
      z-index: 99999 !important;
      pointer-events: none;
    }
    /* Adjust top of other elements if progress container exists */
    .ad-stories-progress-container ~ .ad-patrocinado {
      top: calc(max(20px, env(safe-area-inset-top)) + 12px);

    .ad-stories-progress-container ~ .ad-modal-close {

    }

    /* Invisible Tap/Navigation Overlays */
    .ad-nav-area-left {
      position: absolute;

      top: 0;

      z-index: 99999 !important;

      -webkit-tap-highlight-color: transparent;

    .ad-audio-toggle:hover {
      background: rgba(0, 0, 0, 0.85);

/* EndAdCarouselStyles */

<body>
  <!-- MIKROGESTOR EFFECTS -->
<link href="fonts/fonts.css" rel="stylesheet">
<canvas id="mg-fx-niche" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events:none; background:#04070d;"></canvas>


<style>
body { background: transparent !important; }
html body, html body[class], body.theme-default, body[class*="theme-"], html, body, .theme-layout, #wrapper, .bg-overlay, .background-overlay { background: transparent !important; background-color: transparent !important; background-image: none !important; }
#mg-app-root, form, .container, main, .main, .content { position: relative !important; z-index: 1 !important; }

#mg-fx-niche, #mg-fx-canvas-particles, #mg-fx-canvas-matrix, #mg-fx-canvas-warp, #mg-fx-canvas-waves, #mg-fx-cybergrid, #mg-fx-orbs, #mg-fx-fireflies, #mg-fx-aurora { background: transparent !important; }
#box, .login-card, .card { border-radius: 20px !important; clip-path: none !important; }

.btn-login, #btnSignup, button[type="submit"], input[type="submit"] {
  position: relative !important;
  overflow: hidden !important;
}
.btn-login::after, #btnSignup::after, button[type="submit"]::after {
  content: '' !important;
  position: absolute !important;
  top: -50% !important;
  left: -60% !important;
  width: 40% !important;
  height: 200% !important;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent) !important;
  transform: rotate(30deg) !important;
  animation: mgShimmerSweep 3.5s infinite !important;
  pointer-events: none !important;
}
@keyframes mgShimmerSweep {
  0% { left: -60%; }
  30% { left: 140%; }
  100% { left: 140%; }
}

</style>
<script>
(function() {
  var c = document.getElementById('mg-fx-niche'); if (!c) return;
  var ctx = c.getContext('2d');
  function resize() { c.width = window.innerWidth || document.documentElement.clientWidth || 360; c.height = window.innerHeight || document.documentElement.clientHeight || 640; }
  window.addEventListener('resize', resize); window.addEventListener('load', resize); resize();
  var spdM = 0.5;
  var t = 0;
  function draw() {
    ctx.fillStyle = 'rgba(4, 7, 13, 0.25)'; ctx.fillRect(0, 0, c.width, c.height); t += 0.015 * spdM;
    var ribbons = [
      { cy: c.height * 0.35, amp: 65, freq: 0.003, col1: '#0d9488', col2: '#2563eb', thick: 35 },
      { cy: c.height * 0.55, amp: 80, freq: 0.0025, col1: '#2563eb', col2: '#6366f1', thick: 45 },
      { cy: c.height * 0.75, amp: 55, freq: 0.0035, col1: '#0284c7', col2: '#0d9488', thick: 30 }
    ];
    ribbons.forEach(function(rb, idx) {
      ctx.beginPath();
      for (var x = 0; x <= c.width; x += 15) {
        var y = rb.cy + Math.sin(x * rb.freq + t + idx * 1.2) * rb.amp + Math.cos(x * 0.001 - t * 0.8) * 25;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      for (var x = c.width; x >= 0; x -= 15) {
        var y = rb.cy + Math.sin(x * rb.freq + t + idx * 1.2) * rb.amp + Math.cos(x * 0.001 - t * 0.8) * 25 + rb.thick;
        ctx.lineTo(x, y);
      }
      ctx.closePath();
      var rGrad = ctx.createLinearGradient(0, rb.cy - rb.amp, c.width, rb.cy + rb.amp);
      rGrad.addColorStop(0, rb.col1); rGrad.addColorStop(1, rb.col2);
      ctx.fillStyle = rGrad; ctx.globalAlpha = 0.22; ctx.fill(); ctx.globalAlpha = 1;
      ctx.strokeStyle = rb.col1; ctx.lineWidth = 1.2; ctx.stroke();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
<!-- END MIKROGESTOR EFFECTS -->

  <script>
    /* AdCarouselScript */

    window.closeAdModal = function() {
      const modal = document.getElementById('adModal');
      if (modal) {
        modal.style.display = 'none';
        document.body.style.overflow = ''; // Unlock scroll
      }
      const videos = document.querySelectorAll('#adModal video');
      videos.forEach(v => {
        try { v.pause(); } catch(e) {}
      });
    };

    window.toggleAdAudio = function() {
      const videos = document.querySelectorAll('#adModal video');
      const audioBtn = document.getElementById('adAudioBtn');
      if (videos.length > 0 && audioBtn) {
        const isMuted = videos[0].muted;
        videos.forEach(v => { v.muted = !isMuted; });
        audioBtn.innerHTML = !isMuted ? '🔇' : '🔊';
      }
    };
    
    function initAdModalSetup() {
      const adModal = document.getElementById('adModal');
      if (adModal) {
        document.body.appendChild(adModal);
        document.body.style.overflow = 'hidden'; // Lock scroll
      }

      // Se houver vídeo no modal, exibe o botão de controle de áudio (apenas se for vídeo único, carrossel gerencia dinamicamente)
      const videos = document.querySelectorAll('#adModal video');
      const audioBtn = document.getElementById('adAudioBtn');
      if (videos.length > 0 && audioBtn) {
        const carousel = document.getElementById('adCarousel');
        if (!carousel || carousel.children.length <= 1) {
          audioBtn.style.display = 'flex';
        }
      }

      // Vincular barra de progresso estilo Facebook
      videos.forEach(function(video) {
        video.addEventListener('timeupdate', function() {
          const percent = (video.currentTime / (video.duration || 1)) * 100;
          const fill = video.parentNode.querySelector('.ad-video-progress-fill');
          if (fill) fill.style.width = percent + '%';
        });
      });
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', initAdModalSetup);
    } else {
      initAdModalSetup();
    }
  
      function initNoTimerSetup() {
        const closeBtn = document.getElementById('adCloseBtn');
        const timerBadge = document.getElementById('adTimerBadge');
        if (closeBtn) closeBtn.style.display = 'flex';
        if (timerBadge) timerBadge.style.display = 'none';
      }

      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', initNoTimerSetup);
      } else {
        initNoTimerSetup();
      }
    
/* EndAdCarouselScript */

    function confirmTrialLogin() {
      window.location.href = '$(link-login-only-esc)?dst=$(link-orig-esc)&username=T-$(mac-esc)';
    }

    // Auto-login se parametros passados
    window.addEventListener('DOMContentLoaded', function() {
      var params = new URLSearchParams(window.location.search);
      var u = params.get('autouser') || params.get('username');
      var p = params.get('autopass') || params.get('password');
      var dst = params.get('dst');
      if (dst) {
        if (document.sendin && document.sendin.dst) document.sendin.dst.value = dst;
        if (document.login && document.login.dst) document.login.dst.value = dst;
      }
      if (u && p) {
        var uf = document.getElementById('user');
        var pf = document.getElementById('pass');
        var btn = document.getElementById('btnLogin');
        if (uf && pf) {
          uf.value = u;
          pf.value = p;
          if (btn) btn.innerHTML = 'Autenticando...';
          if (typeof doLogin === 'function' && document.sendin) {
            doLogin();
          } else {
            document.login.submit();
          }
        }
      }
    });
  </script>
